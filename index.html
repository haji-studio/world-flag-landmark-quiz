<!-- World Flag & Landmark Quiz V4.6 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f172a;--card:#1e293b;--brd:#334155;--txt:#f1f5f9;--mut:#94a3b8;--dim:#64748b;--acc:#6366f1;--ok:#22c55e;--no:#ef4444;--warn:#f59e0b}
#app{font-family:'Apple SD Gothic Neo','PingFang SC','Malgun Gothic',sans-serif;max-width:500px;margin:0 auto;padding:14px;background:var(--bg);border-radius:14px;min-height:100svh}
.scr{display:none}.scr.on{display:block;animation:fd .3s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes fu{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-65px)}}
@keyframes shk{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.card{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:14px 18px;margin-bottom:10px}
.bp{width:100%;padding:11px;border-radius:9px;border:none;background:var(--acc);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s}
.bp:hover{opacity:.88}
.bs{width:100%;padding:10px;border-radius:9px;border:1px solid var(--brd);background:var(--card);color:var(--mut);font-size:13px;cursor:pointer;transition:border-color .2s}
.bs:hover{border-color:var(--acc)}
input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid #475569;background:var(--bg);color:var(--txt);font-size:14px;outline:none}
input:focus{border-color:var(--acc)}
.mc{background:var(--card);border:2px solid var(--brd);border-radius:12px;padding:16px 12px;cursor:pointer;text-align:center;transition:all .2s}
.mc:hover{transform:translateY(-2px)}
.ob{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border-radius:9px;border:1px solid var(--brd);background:var(--card);font-size:13px;font-weight:500;cursor:pointer;text-align:left;margin-bottom:7px;color:var(--mut);transition:all .15s}
.ob:hover:not([disabled]){border-color:var(--acc);background:#1a2a4a}
.ob[disabled]{cursor:default}
.ob.ok{background:#052e16!important;border-color:#22c55e!important;color:#4ade80!important}
.ob.no{background:#450a0a!important;border-color:#ef4444!important;color:#f87171!important}
.ob.dm{opacity:.28!important}
.ol{width:26px;height:26px;border-radius:7px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--acc);flex-shrink:0}
.ob.ok .ol{background:#14532d;color:#4ade80}
.ob.no .ol{background:#7f1d1d;color:#f87171}
/* Timer bar */
.tbar-wrap{width:100%;height:8px;background:var(--brd);border-radius:99px;overflow:hidden;margin-bottom:10px}
.tbar{height:100%;width:0%;border-radius:99px;transition:width 1s linear,background .5s}
/* Progress bar */
.pr{background:var(--brd);border-radius:99px;height:5px;overflow:hidden}
.pf{height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
/* Float */
.fl{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-size:22px;font-weight:800;pointer-events:none;animation:fu 1.2s ease-out forwards;white-space:nowrap;z-index:9}
#gw{position:relative}
.ht{font-size:18px;display:inline-block}
.ht.lost{opacity:.2;filter:grayscale(1)}
.lr{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;border:1px solid var(--brd);background:var(--card);margin-bottom:6px}
.lr.me{border-color:var(--acc);background:#1e1b4b}
.tab{flex:1;padding:7px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:500;background:transparent;color:var(--dim);transition:all .2s}
.tab.on{background:var(--acc);color:#fff}
.qtab{display:flex;background:var(--card);border-radius:9px;padding:3px;margin-bottom:10px;border:1px solid var(--brd)}
.qtab-btn{flex:1;padding:8px 4px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:500;background:transparent;color:var(--dim);transition:all .2s}
.qtab-btn.on{background:var(--acc);color:#fff}
.diff-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.dbtn{padding:8px 4px;border-radius:9px;border:1px solid var(--brd);background:var(--card);color:var(--dim);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.dbtn.on{background:#22c55e18;color:#4ade80;border-color:#22c55e}
.q-title{font-size:16px;font-weight:800;color:var(--txt);line-height:1.35;margin-bottom:12px}
.q-sub{font-size:11px;color:var(--dim);margin-top:7px}
.lang-row{display:flex;gap:6px;justify-content:flex-end;margin-bottom:12px}
.lbtn{padding:4px 11px;border-radius:20px;border:1px solid var(--brd);background:transparent;color:var(--mut);font-size:11px;cursor:pointer;transition:all .2s}
.lbtn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
/* Landmark image */
.lm-wrap{position:relative;margin-bottom:4px}
.lm-img{width:100%;height:190px;object-fit:cover;border-radius:10px;border:1px solid var(--brd);display:block}
.lm-badge{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:3px 10px;border-radius:20px;backdrop-filter:blur(4px);pointer-events:none}
.lm-fb{width:100%;height:190px;border-radius:10px;border:1px solid var(--brd);background:var(--card);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px}
/* snd button */
.sndbtn{position:fixed;bottom:16px;right:16px;width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--brd);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:200;transition:background .2s}
.sndbtn:hover{background:var(--acc)}

/* V4 polish: classroom-friendly world adventure UI */
body{background:radial-gradient(circle at 20% 0%,#1d4ed8 0,#0f172a 38%,#020617 100%);}
#app{position:relative;overflow:hidden;box-shadow:0 22px 60px rgba(2,6,23,.55);background:linear-gradient(180deg,#10203f 0%,#0f172a 36%,#111827 100%)}
#app:before{content:"";position:absolute;inset:-80px -40px auto auto;width:180px;height:180px;background:radial-gradient(circle,#38bdf855,transparent 62%);filter:blur(4px);pointer-events:none}
.hero{position:relative;border:1px solid #334155;background:linear-gradient(135deg,#1e3a8a55,#7c3aed33 55%,#14b8a633);border-radius:18px;padding:18px 14px 16px;margin-bottom:12px;overflow:hidden}
.hero:after{content:"✦ ✧ ✦";position:absolute;right:16px;top:12px;color:#fbbf2488;font-size:16px;letter-spacing:6px}
.hero-planet{font-size:52px;margin-bottom:6px;animation:shk 3.8s ease-in-out infinite}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.pill{font-size:10px;color:#cbd5e1;border:1px solid #475569;background:#02061755;padding:4px 8px;border-radius:99px}
.mc{background:linear-gradient(180deg,#1e293b,#111827);min-height:150px;position:relative;overflow:hidden}
.mc:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.08),transparent 42%);pointer-events:none}
.mc.daily{grid-column:1/3;border-color:#f59e0b;background:linear-gradient(135deg,#451a03,#1e293b 55%,#0f172a)}
.mc.daily .daily-tag{display:inline-block;font-size:10px;color:#fde68a;background:#f59e0b22;border:1px solid #f59e0b55;padding:2px 8px;border-radius:99px;margin-top:8px}
.flag-frame{position:relative;width:220px;margin:0 auto;padding:10px;border-radius:16px;background:linear-gradient(145deg,#e2e8f0,#94a3b8);box-shadow:0 16px 30px rgba(0,0,0,.25)}
.flag-frame:after{content:"";position:absolute;inset:10px;border-radius:8px;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 38%);pointer-events:none}
#qtitle{background:linear-gradient(90deg,#fff,#c7d2fe);-webkit-background-clip:text;background-clip:text;color:transparent}
.lm-wrap:after{content:"REAL PHOTO";position:absolute;top:8px;right:8px;font-size:9px;letter-spacing:.5px;color:#fff;background:rgba(15,23,42,.72);border:1px solid rgba(255,255,255,.18);padding:3px 7px;border-radius:99px;backdrop-filter:blur(6px)}
.ob{min-height:54px;border-radius:13px;background:linear-gradient(180deg,#1e293b,#111827)}
.ob:hover:not([disabled]){transform:translateY(-1px);box-shadow:0 8px 20px rgba(2,6,23,.35)}
.result-title{display:inline-block;margin:3px 0 8px;padding:5px 12px;border-radius:99px;background:#f59e0b1d;border:1px solid #f59e0b55;color:#fde68a;font-size:13px;font-weight:800}
.review-card{padding:10px 0;border-top:1px solid var(--brd);display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}
.review-q{font-size:11px;color:#cbd5e1;margin-bottom:4px;font-weight:700}
.review-note{font-size:11px;color:#94a3b8;margin-top:3px;line-height:1.35}
.voicebtn{position:fixed;bottom:64px;right:16px;width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--brd);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:200;transition:background .2s}
.voicebtn.on{background:#f59e0b;color:#111827;border-color:#f59e0b}
.voicebtn:hover{background:#f59e0b;color:#111827}
@media(max-width:420px){#app{border-radius:0}.hero{padding-top:16px}.flag-frame{width:205px}.lm-img,.lm-fb{height:175px}.ob{font-size:12px}}
/* V4.6 polish */
.version-badge{position:absolute;left:12px;top:12px;font-size:10px;color:#cbd5e1;background:rgba(15,23,42,.58);border:1px solid rgba(255,255,255,.16);padding:3px 8px;border-radius:999px;backdrop-filter:blur(6px)}
.daily-done{color:#86efac!important;background:#22c55e22!important;border-color:#22c55e66!important}
#gnx{opacity:.72;pointer-events:auto}
.review-card:first-child{border-top:none}


/* V4.6 landmark photo fixes: full image, no answer-hint city, stronger loading state */
.lm-wrap{background:#08111f;border-radius:14px;border:1px solid #334155;overflow:hidden}
.lm-img{height:230px!important;object-fit:contain!important;background:#08111f;border:none!important;border-radius:13px!important;padding:0;filter:saturate(1.08) contrast(1.04);}
.lm-fb{height:230px!important;background:linear-gradient(135deg,#111827,#0f172a)!important;border:none!important;border-radius:13px!important}
.lm-badge{bottom:10px;left:10px;max-width:72%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(2,6,23,.78);border:1px solid rgba(255,255,255,.14);font-weight:800}
.photo-fb:before{content:"";width:44px;height:44px;border-radius:50%;border:3px solid rgba(148,163,184,.25);border-top-color:#60a5fa;animation:spin 1s linear infinite;margin-bottom:8px}
#glm-loader{display:none!important}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:420px){.lm-img,.lm-fb{height:220px!important}.lm-badge{max-width:78%;font-size:10px}}

</style>

<div id="app">

<!-- Home -->
<div id="s-home" class="scr on">
  <div class="lang-row">
    <button class="lbtn on" id="lb-ko" onclick="setLang('ko')">한국어</button>
    <button class="lbtn" id="lb-en" onclick="setLang('en')">EN</button>
    <button class="lbtn" id="lb-zh" onclick="setLang('zh')">中文</button>
  </div>
  <div class="hero" style="text-align:center">
    <div class="version-badge">V4.6</div>
    <div class="hero-planet">🌍</div>
    <div id="h-title" style="font-size:22px;font-weight:900;color:var(--txt);margin-bottom:3px"></div>
    <div id="h-sub" style="font-size:12px;color:#cbd5e1"></div>
    <div class="pill-row">
      <span class="pill" id="h-pill1"></span>
      <span class="pill" id="h-pill2"></span>
      <span class="pill" id="h-pill3"></span>
    </div>
  </div>
  <div class="qtab">
    <button class="qtab-btn on" id="qt-f" onclick="setQT('flag')">🚩 <span id="qt-f-t"></span></button>
    <button class="qtab-btn" id="qt-l" onclick="setQT('land')">🏛️ <span id="qt-l-t"></span></button>
  </div>
  <div class="diff-row">
    <button class="dbtn on" id="df-easy" onclick="setDiff('easy')">🌱 <span id="df-easy-t"></span></button>
    <button class="dbtn" id="df-normal" onclick="setDiff('normal')">🌍 <span id="df-normal-t"></span></button>
    <button class="dbtn" id="df-hard" onclick="setDiff('hard')">🔥 <span id="df-hard-t"></span></button>
  </div>
  <div class="card">
    <div id="h-nl" style="font-size:12px;color:var(--mut);margin-bottom:7px;font-weight:500"></div>
    <input id="hn" maxlength="12" oninput="chk()">
  </div>
  <div id="h-ml" style="font-size:12px;color:var(--mut);margin-bottom:8px;font-weight:500"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px">
    <div class="mc" id="ms" onclick="startG('survival')" >
      <div style="font-size:28px;margin-bottom:8px">❤️</div>
      <div id="ms-t" style="font-size:14px;font-weight:700;color:var(--txt);margin-bottom:3px"></div>
      <div id="ms-d" style="font-size:11px;color:var(--mut);margin-bottom:8px;line-height:1.4"></div>
      <span style="font-size:10px;color:#f87171;background:#ef444418;padding:2px 8px;border-radius:20px">❤️❤️❤️</span>
    </div>
    <div class="mc" id="mc" onclick="startG('challenge')" >
      <div style="font-size:28px;margin-bottom:8px">🎯</div>
      <div id="mc-t" style="font-size:14px;font-weight:700;color:var(--txt);margin-bottom:3px"></div>
      <div id="mc-d" style="font-size:11px;color:var(--mut);margin-bottom:8px;line-height:1.4"></div>
      <span id="mc-b" style="font-size:10px;color:#4ade80;background:#22c55e18;padding:2px 8px;border-radius:20px"></span>
    </div>
    <div class="mc daily" id="md" onclick="startDaily()" >
      <div style="font-size:30px;margin-bottom:7px">🧭</div>
      <div id="md-t" style="font-size:15px;font-weight:900;color:var(--txt);margin-bottom:3px"></div>
      <div id="md-d" style="font-size:11px;color:#cbd5e1;line-height:1.45"></div>
      <span class="daily-tag" id="md-b"></span>
    </div>
  </div>
  <div id="h-tip" style="font-size:11px;color:#475569;text-align:center;margin-bottom:10px"></div>
  <button class="bs" onclick="openLB()" id="h-lb"></button>
  <div id="hpv" style="display:none;margin-top:10px" class="card">
    <div id="h-top" style="font-size:11px;color:var(--mut);margin-bottom:7px;font-weight:500"></div>
    <div id="hpl"></div>
  </div>
</div>

<!-- Game -->
<div id="s-game" class="scr">
  <div id="gw">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
      <div>
        <div id="gb" style="font-size:11px;padding:2px 9px;border-radius:20px;background:#6366f115;color:#a5b4fc;font-weight:500;display:inline-block;margin-bottom:4px"></div>
        <div id="gl" style="display:flex;gap:3px"></div>
        <div id="gpw" style="display:none">
          <div class="pr" style="width:120px"><div class="pf" id="gpf"></div></div>
          <div id="gpt" style="font-size:10px;color:var(--dim);margin-top:2px"></div>
        </div>
      </div>
      <div style="text-align:right">
        <div id="gsc" style="font-size:17px;font-weight:700;color:var(--acc)">0</div>
        <div style="display:flex;align-items:center;gap:5px;justify-content:flex-end">
          <div id="tnum" style="font-size:13px;font-weight:700;color:#22c55e">15</div>
          <div id="gsp" style="display:none;font-size:10px;color:#fbbf24">⚡</div>
        </div>
      </div>
    </div>
    <!-- Horizontal timer bar -->
    <div class="tbar-wrap">
      <div class="tbar" id="tbar"></div>
    </div>
    <div id="gto" style="display:none;background:#450a0a;border:1px solid #ef4444;border-radius:8px;padding:8px;text-align:center;color:#fca5a5;font-size:12px;font-weight:600;margin-bottom:8px"></div>
    <!-- Question card -->
    <div style="background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:18px 14px 12px;text-align:center;margin-bottom:12px">
      <div id="qtitle" class="q-title"></div>
      <!-- Flag mode -->
      <div id="q-flag">
        <div class="flag-frame"><span id="gfl" style="display:block;width:200px;height:133px;margin:0 auto;border-radius:7px;border:1px solid #475569;background-size:cover;background-position:center"></span></div>
      </div>
      <!-- Landmark mode -->
      <div id="q-land" style="display:none">
        <div class="lm-wrap">
          <img id="gimg" class="lm-img" src="" alt="" loading="eager"
            onerror="landmarkImgFail(this)">
          <div id="glm-fb" style="display:none" class="lm-fb photo-fb">
            <div id="glm-loader" class="photo-loader"></div>
            <div id="glm-name" style="font-size:13px;color:var(--mut)"></div>
            <div id="glm-fb-msg" style="font-size:10px;color:#64748b">사진을 불러오는 중입니다</div>
          </div>
          <div class="lm-badge" id="glm-badge"></div>
        </div>
      </div>
      <div id="grg" style="margin-top:8px;font-size:11px;color:#475569"></div>
    </div>
    <div id="gopts"></div>
    <div id="gfb" style="display:none;animation:fd .25s ease" class="card">
      <div id="gfm" style="font-size:14px;font-weight:600;margin-bottom:3px"></div>
      <div id="gfs" style="font-size:12px;color:var(--mut)"></div>
    </div>
    <button class="bp" id="gnx" style="display:none;margin-top:8px" onclick="nxt()"></button>
  </div>
</div>

<!-- Results -->
<div id="s-res" class="scr">
  <div class="card" style="text-align:center;margin-bottom:10px">
    <div id="rem" style="font-size:44px;margin-bottom:3px"></div>
    <div id="rgr" style="font-size:48px;font-weight:900;margin-bottom:3px"></div>
    <div id="rmsg" style="font-size:12px;color:var(--mut);margin-bottom:2px"></div>
    <div id="rtitle" class="result-title"></div>
    <div id="rnk" style="font-size:12px;color:var(--dim);margin-bottom:5px"></div>
    <div id="rsc" style="font-size:28px;font-weight:700;color:var(--txt);margin-bottom:3px"></div>
    <div id="rnew" style="display:none;font-size:12px;color:#fbbf24;font-weight:600;margin-bottom:5px">🎉</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:7px">
      <div style="background:var(--bg);border-radius:7px;padding:8px">
        <div id="rco" style="font-size:20px;font-weight:700;color:#4ade80"></div>
        <div id="r-c" style="font-size:10px;color:var(--dim)"></div>
      </div>
      <div style="background:var(--bg);border-radius:7px;padding:8px">
        <div id="rwr" style="font-size:20px;font-weight:700;color:#f87171"></div>
        <div id="r-w" style="font-size:10px;color:var(--dim)"></div>
      </div>
      <div style="background:var(--bg);border-radius:7px;padding:8px">
        <div id="rti" style="font-size:20px;font-weight:700;color:#fbbf24"></div>
        <div id="r-t" style="font-size:10px;color:var(--dim)"></div>
      </div>
    </div>
  </div>
  <div class="card" style="padding:0;overflow:hidden;margin-bottom:10px">
    <button onclick="togW()" style="width:100%;padding:11px 15px;background:transparent;border:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center">
      <span id="rwl" style="font-size:13px;font-weight:500;color:#f87171"></span>
      <span id="rwc" style="color:var(--dim)">▼</span>
    </button>
    <div id="rwls" style="display:none;padding:0 15px 12px;border-top:1px solid var(--brd)"></div>
  </div>
  <button id="rwrtry" class="bp" onclick="retryWrong()" style="display:none;margin-bottom:7px"></button>
  <button id="rsh" class="bs" onclick="cpyR()" style="margin-bottom:7px"></button>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:7px">
    <button class="bs" onclick="retry()" id="r-rt"></button>
    <button class="bs" onclick="gohome()" id="r-hm"></button>
  </div>
  <button class="bp" onclick="openLB()" id="r-lb"></button>
</div>

<!-- Leaderboard -->
<div id="s-lb" class="scr">
  <div style="text-align:center;margin-bottom:12px">
    <div id="lb-ti" style="font-size:20px;font-weight:700;color:var(--txt);margin-bottom:2px"></div>
    <div id="lb-su" style="font-size:11px;color:var(--dim)"></div>
  </div>
  <div style="display:flex;background:var(--card);border-radius:9px;padding:3px;margin-bottom:11px;border:1px solid var(--brd)">
    <button class="tab on" id="lts" onclick="slt('survival')"></button>
    <button class="tab" id="ltc" onclick="slt('challenge')"></button>
  </div>
  <div id="lbl"></div>
  <div id="lbe" style="display:none;text-align:center;padding:28px 0;color:#475569">
    <div style="font-size:32px;margin-bottom:7px">📭</div>
    <div id="lb-em"></div>

function wikiSummaryUrl(title){return 'https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title||'');}
function wikiPageUrl(title){return 'https://en.wikipedia.org/wiki/'+encodeURIComponent(title||'').replace(/%20/g,'_');}
function commonsFileUrl(file,width=960){return 'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(file)+'?width='+width;}
function commonsRedirectUrl(file,width=960){return 'https://commons.wikimedia.org/wiki/Special:Redirect/file/'+encodeURIComponent(file)+'?width='+width;}
function commonsFilePage(file){return 'https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(file).replace(/%20/g,'_');}
function getOriginalCommonsFile(url){
  try{
    const clean=url.split('?')[0];
    const parts=clean.split('/').filter(Boolean);
    const idx=parts.findIndex(x=>x==='thumb');
    if(idx>=0 && parts.length>=idx+4) return decodeURIComponent(parts[parts.length-2]);
    return decodeURIComponent(parts[parts.length-1]||'');
  }catch(e){return '';}
}
const LM_FILE_FIX={mx:'Chichen Itzá.jpg'};
const IMG_CACHE={};
LM.forEach(l=>{
  l.origImg=l.img||'';
  l.file=LM_FILE_FIX[l.c]||l.file||(l.origImg?getOriginalCommonsFile(l.origImg):'');
  const srcs=[];
  if(l.origImg)srcs.push(l.origImg);
  if(l.file){
    l.page=commonsFilePage(l.file);
    srcs.push(commonsFileUrl(l.file,960),commonsFileUrl(l.file,640),commonsRedirectUrl(l.file,960),commonsRedirectUrl(l.file,640),commonsFileUrl(l.file,480));
  }
  l.srcs=[...new Set(srcs.filter(Boolean))];
  l.img=l.srcs[0]||'';
});
async function fetchWikiThumb(lm){
  if(!lm||!lm.wiki)return '';
  const key=lm.wiki;
  if(IMG_CACHE[key])return IMG_CACHE[key];
  try{
    const r=await fetch(wikiSummaryUrl(key),{headers:{'accept':'application/json'}});
    if(!r.ok)throw new Error('wiki '+r.status);
    const d=await r.json();
    const src=(d.thumbnail&&d.thumbnail.source)||(d.originalimage&&d.originalimage.source)||'';
    IMG_CACHE[key]=src;
    return src;
  }catch(e){return '';}
}
function landmarkImgFail(img){
  let srcs=[];
  try{srcs=JSON.parse(img.dataset.srcs||'[]');}catch(e){}
  const next=(parseInt(img.dataset.idx||'0',10)||0)+1;
  if(srcs[next]){
    img.dataset.idx=String(next);
    img.src=srcs[next];
    return;
  }
  img.style.display='none';
  const fb=document.getElementById('glm-fb');
  if(fb)fb.style.display='flex';
}
async function loadLandmarkImage(img,lm){
  if(!img||!lm)return;
  const fb=document.getElementById('glm-fb');
  const token=(lm.wiki||lm.ko||'')+'_'+Date.now();
  img.dataset.token=token;
  let srcs=lm.srcs&&lm.srcs.length?[...lm.srcs]:[];
  img.dataset.idx='0';
  img.dataset.srcs=JSON.stringify(srcs);
  img.alt=lmName(lm)+' photo';
  if(srcs[0]){img.style.display='block';if(fb)fb.style.display='none';img.src=srcs[0];return;}
  img.style.display='none';
  if(fb)fb.style.display='flex';
  const thumb=await fetchWikiThumb(lm);
  if(img.dataset.token!==token)return;
  if(thumb){
    srcs=[thumb];
    img.dataset.idx='0';
    img.dataset.srcs=JSON.stringify(srcs);
    if(fb)fb.style.display='none';
    img.style.display='block';
    img.src=thumb;
  }
}
function preloadLandmarkImage(q){
  try{
    if(q&&q.type==='land'&&q.lm){
      if(q.lm.img){const im=new Image();im.src=q.lm.img;}
      else if(q.lm.wiki)fetchWikiThumb(q.lm);
    }

const BGM=(()=>{
  let ctx=null,playing=false,nodes=[],loopTO=null,trackIdx=0;
  const TRACKS=[
    // Track 1: C major pentatonic - upbeat world explorer
    [523,659,784,1047,784,659,523,392,523,659,784,659,784,1047,784,523],
    // Track 2: G pentatonic - playful discovery
    [392,494,587,784,587,494,392,330,392,494,587,494,392,330,294,330],
    // Track 3: D minor - mysterious landmarks
    [294,349,440,523,440,349,294,262,294,349,440,349,294,220,262,294]
  ];
  const ND=0.38;
  function mkNote(f,st,dur,vol=0.07){
    if(!ctx)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0.001,st);
    g.gain.linearRampToValueAtTime(vol,st+0.04);
    g.gain.exponentialRampToValueAtTime(0.001,st+dur*0.88);
    o.connect(g); g.connect(ctx.destination);
    o.start(st); o.stop(st+dur);
    nodes.push(o);
  }
  function playLoop(){
    if(!playing||!ctx)return;
    const mel=TRACKS[trackIdx%TRACKS.length];
    const now=ctx.currentTime+0.1;
    mel.forEach((f,i)=>mkNote(f,now+i*ND,ND*0.85));
    // Bass notes every 4 beats
    mel.filter((_,i)=>i%4===0).forEach((f,i)=>{
      mkNote(f/2,now+i*ND*4,ND*3,0.04);
    });
    const total=mel.length*ND+0.6;
    loopTO=setTimeout(()=>{if(playing){trackIdx++;playLoop();}},total*1000);
  }
  return{
    init(){
      if(ctx){if(ctx.state==='suspended')ctx.resume();return true;}
      try{ctx=new(window.AudioContext||window.webkitAudioContext)();return true;}
      catch(e){return false;}
    },
    start(){if(!this.init()||playing)return;playing=true;playLoop();},
    stop(){playing=false;clearTimeout(loopTO);nodes.forEach(n=>{try{n.stop(0);}catch(e){}});nodes=[];},
    toggle(){if(playing){this.stop();return false;}this.start();return true;},
    isPlaying(){return playing;},
    sfx(t){
      if(!ctx)return;
      const now=ctx.currentTime;
      if(t==='ok')[523,659,784].forEach((f,i)=>mkNote(f,now+i*0.1,0.18,0.14));
      else if(t==='no')[440,330].forEach((f,i)=>mkNote(f,now+i*0.12,0.16,0.1));
      else if(t==='tick')mkNote(1200,now,0.05,0.06);
    }
  };
})();

function sh(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function todayKey(){const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
function seeded(seed){let h=2166136261>>>0;for(let i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619);}return()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function shSeed(a,seed){let b=[...a],rnd=seeded(seed);for(let i=b.length-1;i>0;i--){let j=Math.floor(rnd()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

// ============================================================
// PREP QUESTIONS
// ============================================================
function prep(m){
  // Flag quiz: difficulty controls the country pool. Easy keeps the first play friendly.
  const base=activeCountries();
  const pool=m==='challenge'?sh(base).slice(0,challengeTotal()):sh([...base]);
  return pool.map(c=>{
    const sm=base.filter(x=>x[2]===c[2]&&x[0]!==c[0]);
    const df=base.filter(x=>x[2]!==c[2]&&x[0]!==c[0]);
    let wr=sh(sm).slice(0,3);
    if(wr.length<3)wr=[...wr,...sh(df).slice(0,3-wr.length)];
    const opts=sh([c,...wr.slice(0,3)]);
    return{type:'flag',code:c[0],name:c[1],reg:c[2],opts,cor:opts.findIndex(x=>x[0]===c[0])};
  });
}

function prepLand(m){
  // Landmark quiz: same difficulty idea, but filtered by countries with landmarks.
  const ac=new Set(activeCodes());
  let base=LM.filter(l=>ac.has(l.c));
  if(base.length<4)base=[...LM];
  const pool=m==='challenge'?sh([...base]).slice(0,challengeTotal()):sh([...base]);
  return pool.map(lm=>{
    const country=C.find(c=>c[0]===lm.c);
    const region=country?country[2]:'Asia';
    let wrongLM=base.filter(l=>l.c!==lm.c&&C.find(c=>c[0]===l.c&&c[2]===region));
    if(wrongLM.length<3)wrongLM=[...wrongLM,...base.filter(l=>l.c!==lm.c&&!wrongLM.includes(l))];
    if(wrongLM.length<3)wrongLM=[...wrongLM,...LM.filter(l=>l.c!==lm.c&&!wrongLM.includes(l))];
    const wrongs=sh(wrongLM).slice(0,3).map(l=>l.c);
    const opts=sh([lm.c,...wrongs]);
    return{type:'land',lm,code:lm.c,name:country?country[1]:'',reg:region,opts,cor:opts.indexOf(lm.c)};
  });
}


function prepDaily(){
  const seed=todayKey()+'_'+difficulty;
  const flags=shSeed(prep('challenge'),seed+'_flags').slice(0,6);
  const lands=shSeed(prepLand('challenge'),seed+'_lands').slice(0,4);
  return shSeed([...flags,...lands],seed+'_mix');
}

function grd(pct){
  if(mode==='challenge'||mode==='daily'||mode==='review'){if(pct>=90)return'S';if(pct>=75)return'A';if(pct>=60)return'B';if(pct>=45)return'C';return'D';}
  if(sc>=200)return'S';if(sc>=150)return'A';if(sc>=100)return'B';if(sc>=50)return'C';return'D';
}

function showOpts(q,correctIdx,chosenIdx,revealed){
  const w=document.getElementById('gopts');

  q.opts.forEach((c,i)=>{
    const code=q.type==='flag'?c[0]:c;

    btn.className='ob';
    if(revealed&&correctIdx>=0){
      if(i===correctIdx)btn.classList.add('ok');
      else if(i===chosenIdx)btn.classList.add('no');
      else btn.classList.add('dm');
      btn.setAttribute('disabled','true');
    }
    // Label badge
    const lb=document.createElement('span');
    lb.className='ol'; lb.textContent=LS[i];
    // Name only: no mini flags in choices, otherwise flag quiz becomes too easy.
    const ns=document.createElement('span');
    ns.style.flex='1'; ns.textContent=name||code;
    // KB hint
    const kb=document.createElement('span');
    kb.style.cssText='font-size:10px;color:#475569'; kb.textContent=i+1;

    btn.append(lb,ns,kb);
    if(!revealed||correctIdx<0)btn.onclick=()=>pick(i);
    w.appendChild(btn);
  });
}

function pick(i){
  if(ch!==null)return;
  stpT(); ch=i;
  const q=qs[qi];
  const ok=i===q.cor;
  const bonus=ok&&tl>Math.ceil(maxTime()*0.7);
  const gained=ok?10+(bonus?5:0):0;
  if(ok){sc+=gained;shFl(gained);BGM.sfx('ok');}
  else{if(mode==='challenge')sc=Math.max(0,sc-2);BGM.sfx('no');}
  as.push({q,ch:i,ok,score:gained});
  showOpts(q,q.cor,i,true);
  if(!ok&&mode==='survival'){lv--;updL();if(lv<=0){shFB(false,false,q);setTimeout(()=>endG(),1600);return;}}
  shFB(ok,false,q,bonus);
}

function shFl(pts){
  const el=document.createElement('div');
  el.className='fl';
  el.style.color=pts>10?'#fbbf24':'#4ade80';
  el.textContent='+'+pts+scoreWord()+(pts>10?' ⚡':'');

function shFB(ok,isTO,q,bonus){
  const fb=document.getElementById('gfb'),fm=document.getElementById('gfm'),fs=document.getElementById('gfs');
  const qname=q.type==='flag'?cname(q.code):lmName(q.lm);
  const country=q.type==='flag'?qname:cname(q.code);

  else if(isTO) fm.textContent=t('ans_to')+(q.type==='flag'?country:qname+' ('+country+')');
  else fm.textContent=t('ans_no')+(q.type==='flag'?country:qname+' ('+country+')');
  // Show landmark name on reveal
  if(q.type==='land'){
    const badge=document.getElementById('glm-badge');
    if(badge){const ln=lmName(q.lm);const country=cname(q.code);badge.textContent=ln+' · '+country;}
  }
  fs.textContent=mode==='survival'&&lv<=0?t('game_ov'):'';
  fb.style.display='block';
  const nb=document.getElementById('gnx');
  nb.style.display='block';
  const total=gameTotal();
  const hasNext=(mode==='survival'&&lv>0)||((mode==='challenge'||mode==='daily'||mode==='review')&&qi+1<total);
  nb.textContent=hasNext?t('auto_move'):t('res');
  const delay=ok?1100:1800;
  stpAuto();
  autoNextTimer=setTimeout(()=>{
    autoNextTimer=null;
    if(document.getElementById('s-game').classList.contains('on'))nxt();
  }, hasNext?delay:2000);
}

function onTO(){
  if(ch!==null)return;ch=-1;
  const q=qs[qi];
  as.push({q,ch:-1,ok:false,score:0});
  if(mode==='survival'){lv--;updL();}
  document.getElementById('gto').textContent=t('timeout');
  document.getElementById('gto').style.display='block';
  showOpts(q,q.cor,-1,true);
  if(mode==='survival'&&lv<=0){setTimeout(()=>endG(),1400);return;}
  shFB(false,true,q,false);
}

function nxt(){
  stpAuto();
  const total=gameTotal();
  if(mode==='survival'&&lv<=0){endG();return;}
  if((mode==='challenge'||mode==='daily'||mode==='review')&&qi+1>=total){endG();return;}
  qi++;
  if(mode==='survival'&&qi>=qs.length)qs=[...qs,...(qtype==='flag'?prep('survival'):prepLand('survival'))];
  rnQ();
}

function kbH(e){
  if(!document.getElementById('s-game').classList.contains('on'))return;
  if(['1','2','3','4'].includes(e.key)&&ch===null)pick(parseInt(e.key)-1);
  if(e.key==='Enter'&&ch!==null)nxt();
}

function endG(){
  stpT(); document.onkeydown=null;
  if(window.speechSynthesis)try{window.speechSynthesis.cancel();}catch(e){}
  const el=Math.round((Date.now()-t0)/1000);
  const cor=as.filter(a=>a.ok).length,tot=as.length;
  const pct=tot?Math.round((cor/tot)*100):0;
  const g=grd(pct),gi=GI[g];
  const isN=mode==='survival'?sc>bS:(mode==='challenge'?sc>bC:false);
  if(mode==='survival'&&sc>bS)bS=sc;
  if(mode==='challenge'&&sc>bC)bC=sc;
  svBest(); if(mode!=='review')svLB(cor,tot,el,g);
  if(mode==='daily')sSet('wq_daily_done_'+todayKey()+'_'+difficulty,'1',false);
  document.getElementById('rem').textContent=gi.e;
  document.getElementById('rgr').textContent=g;document.getElementById('rgr').style.color=gi.c;
  document.getElementById('rmsg').textContent=t('gm')[g];
  document.getElementById('rtitle').textContent=t('title_'+g);
  document.getElementById('rnk').textContent=nick+t('your_r');
  document.getElementById('rsc').textContent=sc+scoreWord();
  document.getElementById('rnew').style.display=isN?'block':'none';
  document.getElementById('rco').textContent=cor;
  document.getElementById('rwr').textContent=tot-cor;
  document.getElementById('rti').textContent=fmt(el);
  const wrongs=as.filter(a=>!a.ok);
  document.getElementById('rwrtry').style.display=wrongs.length?'block':'none';
  document.getElementById('rwl').textContent=t('wr_rev')+' ('+wrongs.length+')';
  document.getElementById('rwls').innerHTML=wrongs.length?wrongs.map((a,i)=>{
    const q=a.q;
    const correctName=q.type==='flag'?cname(q.code):lmName(q.lm)+' · '+cname(q.code);
    const chosenCode=a.ch>=0?(q.type==='flag'?q.opts[a.ch][0]:q.opts[a.ch]):null;
    const chosenName=a.ch>=0?cname(chosenCode):(lang==='zh'?'超时':(lang==='en'?'Time up':'시간 초과'));
    const flagCode=q.code;
    const qtxt=questionText(q);
    const note=q.type==='flag'
      ? `${t('review_hint')}: ${cname(q.code)} · ${tr(q.reg)}`
      : `${t('review_hint')}: ${lmName(q.lm)} · ${lmCity(q.lm)} · ${cname(q.code)}`;
    return`<div class="review-card">
      <span class="fi fi-${flagCode}" style="width:42px;height:28px;border-radius:4px;background-size:cover;border:0.5px solid #475569;display:inline-block"></span>
      <div><div class="review-q">${i+1}. ${qtxt}</div>
      <div style="font-size:12px;color:#f87171;margin-bottom:2px">${t('my_a')}${chosenName}</div>
      <div style="font-size:12px;color:#4ade80">${t('rt_a')}${correctName}</div>
      <div class="review-note">${note}</div></div></div>`;
  }).join(''):`<div style="padding:16px 0;color:#4ade80;font-size:13px;text-align:center">${lang==='zh'?'全部答对！':(lang==='en'?'All correct!':'전부 정답입니다!')}</div>`;
  wop=false;document.getElementById('rwls').style.display='none';document.getElementById('rwc').textContent='▼';
  goS('s-res');
}

function togW(){wop=!wop;document.getElementById('rwls').style.display=wop?'block':'none';document.getElementById('rwc').textContent=wop?'▲':'▼';}

function retry(){
  stpAuto();
  qi=0;sc=0;lv=3;as=[];ch=null;wop=false;t0=Date.now();
  if(mode==='daily')qs=prepDaily();
  else if(mode==='review')qs=qtype==='flag'?prep('challenge'):prepLand('challenge');
  else qs=qtype==='flag'?prep(mode):prepLand(mode);
  if(mode==='survival')updL();
  goS('s-game');rnQ();document.onkeydown=kbH;
}
function retryWrong(){
  const wrongs=as.filter(a=>!a.ok).map(a=>a.q);
  if(!wrongs.length)return;
  mode='review'; qs=sh(wrongs); qi=0; sc=0; lv=3; as=[]; ch=null; wop=false; t0=Date.now();
  document.getElementById('gb').textContent=t('wrong_retry')+' · '+t('diff_'+difficulty);
  document.getElementById('gl').style.display='none';document.getElementById('gpw').style.display='block';
  goS('s-game'); rnQ(); document.onkeydown=kbH;
}

function cpyR(){
  const cor=as.filter(a=>a.ok).length,g=grd(Math.round((cor/Math.max(as.length,1))*100));
  const modeName=mode==='survival'?t('surv'):(mode==='daily'?t('daily'):(mode==='review'?t('wrong_retry'):t('chal')));
  const qtName=qtype==='flag'?t('qt_flag'):t('qt_land');
  const txt=`🌍 ${t('title')}\n${nick}${t('your_r')}\n${modeName} · ${qtName} · ${t('diff_'+difficulty)}\n${lang==='zh'?'得分':(lang==='en'?'Score':'점수')}: ${sc}${scoreWord()} | ${lang==='zh'?'正确':(lang==='en'?'Correct':'정답')}: ${cor}/${as.length}\n${lang==='zh'?'等级':(lang==='en'?'Grade':'등급')}: ${g}\n\n${lang==='zh'?'一起挑战！':(lang==='en'?'Try the world challenge!':'나도 도전해보기!')}`;
  navigator.clipboard.writeText(txt).then(()=>{const b=document.getElementById('rsh');b.textContent=t('copied');setTimeout(()=>b.textContent=t('share'),2000);}).catch(()=>{});
}

// ============================================================
// LEADERBOARD
// ============================================================
function sGet(key,shared=false){
  try{if(window.storage&&window.storage.get)return window.storage.get(key,shared).then(r=>r?r.value:null).catch(()=>localStorage.getItem(key));}
  catch(e){}
  return Promise.resolve(localStorage.getItem(key));
}
function sSet(key,val,shared=false){
  try{localStorage.setItem(key,val);}catch(e){}
  try{if(window.storage&&window.storage.set)return window.storage.set(key,val,shared).catch(()=>{});}
  catch(e){}
  return Promise.resolve();
}
async function svLB(cor,tot,el,g){
  const key='wq_'+mode+'_'+qtype+'_'+difficulty;
  const now=new Date();
  const ts=(now.getMonth()+1)+'/'+now.getDate()+' '+now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
  const entry={nickname:nick,score:sc,correct:cor,total:tot,time:el,grade:g,date:ts,lang,difficulty};
  let list=[];
  try{list=JSON.parse(await sGet(key,true)||'[]');}catch(e){list=[];}
  list.push(entry);list.sort((a,b)=>b.score-a.score);list=list.slice(0,20);
  await sSet(key,JSON.stringify(list),true);
}
async function ldLB(m,qt){try{return JSON.parse(await sGet('wq_'+m+'_'+qt+'_'+difficulty,true)||'[]');}catch(e){return[];}}
async function svBest(){await sSet('wq_bs_'+difficulty,String(bS),false);await sSet('wq_bc_'+difficulty,String(bC),false);}
async function ldBests(){
  try{const s=await sGet('wq_bs_'+difficulty,false),c=await sGet('wq_bc_'+difficulty,false);if(s)bS=parseInt(s)||0;if(c)bC=parseInt(c)||0;}catch(e){}
  try{const sl=await ldLB('survival',qtype),top=sl.slice(0,3);if(top.length){document.getElementById('hpv').style.display='block';const md=['🥇','🥈','🥉'];document.getElementById('hpl').innerHTML=top.map((e,i)=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--brd)"><span>${md[i]} ${e.nickname}</span><span style="color:var(--acc);font-weight:600">${e.score}${scoreWord()}</span></div>`).join('');}}catch(e){}
}
async function openLB(){ltab='survival';document.getElementById('lts').className='tab on';document.getElementById('ltc').className='tab';goS('s-lb');rnLB();}
async function slt(t2){ltab=t2;document.getElementById('lts').className='tab'+(t2==='survival'?' on':'');document.getElementById('ltc').className='tab'+(t2==='challenge'?' on':'');rnLB();}
async function rnLB(){
  const list=await ldLB(ltab,qtype),el=document.getElementById('lbl'),em=document.getElementById('lbe');
  if(!list.length){el.innerHTML='';em.style.display='block';return;}
  em.style.display='none';const md=['🥇','🥈','🥉'];const gi=GI;
  el.innerHTML=list.map((e,i)=>{const isMe=e.nickname===nick;const g=e.grade||'D';const gc=gi[g]?gi[g].c:'#64748b';
    return`<div class="lr${isMe?' me':''}"><span style="font-size:16px;width:26px;text-align:center;flex-shrink:0">${i<3?md[i]:(i+1)+'.'}</span><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500;color:var(--txt)">${e.nickname}${isMe?` <span style="font-size:10px;background:#6366f130;color:#a5b4fc;padding:1px 5px;border-radius:20px">me</span>`:''}</div><div style="font-size:10px;color:#475569">${e.correct||0}/${e.total||0} · ${fmt(e.time||0)} · ${e.date||''}</div></div><div style="text-align:right;flex-shrink:0"><div style="font-size:13px;font-weight:700;color:${gc}">${g}</div><div style="font-size:12px;color:var(--mut)">${e.score}${scoreWord()}</div></div></div>`;
  }).join('');
}
