<!-- 60s World Quiz V4.8, based on flags_quiz_v4_7_3d_globe.html -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#061829">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WorldQuiz">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f172a;--card:#1e293b;--brd:#334155;--txt:#f1f5f9;--mut:#94a3b8;--dim:#64748b;--acc:#6366f1;--ok:#22c55e;--no:#ef4444;--warn:#f59e0b}
#app{font-family:'Apple SD Gothic Neo','PingFang SC','Malgun Gothic',sans-serif;max-width:500px;margin:0 auto;padding:14px;background:var(--bg);border-radius:14px;min-height:100svh}
.scr{display:none}.scr.on{display:block;animation:fd .3s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes fu{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-65px)}}
@keyframes shk{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}15%{transform:translateX(-9px)}30%{transform:translateX(8px)}45%{transform:translateX(-6px)}60%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@keyframes correctPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-62%) scale(.9)}}
@keyframes flashOk{0%{opacity:0}20%{opacity:.42}100%{opacity:0}}
@keyframes flashNo{0%{opacity:0}20%{opacity:.5}100%{opacity:0}}
.card{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:14px 18px;margin-bottom:10px}
.bp{width:100%;padding:11px;border-radius:9px;border:none;background:var(--acc);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s}
.bp:hover{opacity:.88}
.bs{width:100%;padding:10px;border-radius:9px;border:1px solid var(--brd);background:var(--card);color:var(--mut);font-size:13px;cursor:pointer;transition:border-color .2s}
.bs:hover{border-color:var(--acc)}
input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid #475569;background:var(--bg);color:var(--txt);font-size:14px;outline:none}
input:focus{border-color:var(--acc)}
.mc{background:var(--card);border:2px solid var(--brd);border-radius:12px;padding:16px 12px;cursor:pointer;text-align:center;transition:all .2s}
.mc:hover{transform:translateY(-2px)}
.ob{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border-radius:9px;border:1px solid var(--brd);background:var(--card);font-size:13px;font-weight:500;cursor:pointer;text-align:left;margin-bottom:7px;color:var(--mut);transition:all .15s}
.ob:hover:not([disabled]){border-color:var(--acc);background:#1a2a4a}
.ob[disabled]{cursor:default}
.ob.ok{background:#052e16!important;border-color:#22c55e!important;color:#4ade80!important}
.ob.no{background:#450a0a!important;border-color:#ef4444!important;color:#f87171!important}
.ob.dm{opacity:.28!important}
.ol{width:26px;height:26px;border-radius:7px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--acc);flex-shrink:0}
.ob.ok .ol{background:#14532d;color:#4ade80}
.ob.no .ol{background:#7f1d1d;color:#f87171}
/* Timer bar */
.tbar-wrap{width:100%;height:8px;background:var(--brd);border-radius:99px;overflow:hidden;margin-bottom:10px}
.tbar{height:100%;width:0%;border-radius:99px;transition:width 1s linear,background .5s}
/* Progress bar */
.pr{background:var(--brd);border-radius:99px;height:5px;overflow:hidden}
.pf{height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
/* Float */
.fl{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-size:22px;font-weight:800;pointer-events:none;animation:fu 1.2s ease-out forwards;white-space:nowrap;z-index:9}
#gw{position:relative}
#gw.wrong-shake{animation:wrongShake .42s ease}
.answer-pop{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:500;pointer-events:none;padding:14px 22px;border-radius:999px;font-size:24px;font-weight:1000;letter-spacing:-.5px;box-shadow:0 18px 45px rgba(0,0,0,.45);animation:correctPop 1.05s ease forwards}
.answer-pop.ok{background:linear-gradient(135deg,#22c55e,#06b6d4);color:#ecfeff;border:1px solid rgba(255,255,255,.35)}
.answer-pop.no{background:linear-gradient(135deg,#ef4444,#7f1d1d);color:#fff1f2;border:1px solid rgba(255,255,255,.28)}
.screen-flash{position:fixed;inset:0;z-index:480;pointer-events:none}
.screen-flash.ok{background:radial-gradient(circle,rgba(34,197,94,.55),transparent 58%);animation:flashOk .7s ease forwards}
.screen-flash.no{background:radial-gradient(circle,rgba(239,68,68,.58),transparent 58%);animation:flashNo .7s ease forwards}
.burst-star{position:fixed;left:50%;top:44%;z-index:501;pointer-events:none;color:#fde047;font-size:18px;font-weight:900;animation:fu .9s ease-out forwards}
.ht{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;margin-right:4px;transition:opacity .2s,transform .2s}
.ht svg{width:25px;height:25px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.28))}
.ht.lost{opacity:.22;filter:grayscale(1);transform:scale(.92)}
.lr{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;border:1px solid var(--brd);background:var(--card);margin-bottom:6px}
.lr.me{border-color:var(--acc);background:#1e1b4b}
.tab{flex:1;padding:7px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:500;background:transparent;color:var(--dim);transition:all .2s}
.tab.on{background:var(--acc);color:#fff}
.qtab{display:flex;background:var(--card);border-radius:9px;padding:3px;margin-bottom:10px;border:1px solid var(--brd)}
.qtab-btn{flex:1;padding:8px 4px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:500;background:transparent;color:var(--dim);transition:all .2s}
.qtab-btn.on{background:var(--acc);color:#fff}
.diff-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.dbtn{padding:8px 4px;border-radius:9px;border:1px solid var(--brd);background:var(--card);color:var(--dim);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.dbtn.on{background:#22c55e18;color:#4ade80;border-color:#22c55e}
.q-title{font-size:16px;font-weight:800;color:var(--txt);line-height:1.35;margin-bottom:12px}
.q-sub{font-size:11px;color:var(--dim);margin-top:7px}
.lang-row{display:flex;gap:6px;justify-content:flex-end;margin-bottom:12px}
.lbtn{padding:4px 11px;border-radius:20px;border:1px solid var(--brd);background:transparent;color:var(--mut);font-size:11px;cursor:pointer;transition:all .2s}
.lbtn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
/* Landmark image */
.lm-wrap{position:relative;margin-bottom:4px}
.lm-img{width:100%;height:190px;object-fit:cover;border-radius:10px;border:1px solid var(--brd);display:block}
.lm-badge{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:3px 10px;border-radius:20px;backdrop-filter:blur(4px);pointer-events:none}
.lm-fb{width:100%;height:190px;border-radius:10px;border:1px solid var(--brd);background:var(--card);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px}
/* snd button */
.sndbtn{position:fixed;bottom:16px;right:16px;width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--brd);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:200;transition:background .2s}
.sndbtn.on{background:#2563eb;color:white;border-color:#38bdf8}
.sndbtn:hover{background:var(--acc)}
.audio-panel{position:fixed;right:16px;bottom:66px;width:min(300px,calc(100vw - 32px));z-index:260;padding:14px;background:rgba(8,17,31,.97);border:1px solid #475569;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.5);display:none}
.audio-panel.on{display:block;animation:fd .18s ease}
.audio-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:#f8fafc;font-size:14px;font-weight:900}
.audio-close{border:0;background:transparent;color:#94a3b8;font-size:20px;cursor:pointer;line-height:1}
.audio-row{display:grid;grid-template-columns:66px 1fr 42px;align-items:center;gap:9px;margin-top:10px;color:#cbd5e1;font-size:12px}
.audio-row input[type=range]{padding:0;border:0;background:transparent;accent-color:#38bdf8}
.audio-toggle{height:26px;border:1px solid #475569;border-radius:99px;background:#1e293b;color:#94a3b8;font-size:10px;font-weight:800;cursor:pointer}
.audio-toggle.on{background:#0c4a6e;border-color:#38bdf8;color:#e0f2fe}
.audio-track{margin-top:10px;padding-top:10px;border-top:1px solid #334155;color:#64748b;font-size:10px}
.home-audio-btn{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;border:1px solid #475569;background:#172033;color:#cbd5e1;font-size:11px;font-weight:800;cursor:pointer}
.home-audio-btn.on{border-color:#38bdf8;background:#075985;color:#fff;box-shadow:0 0 0 2px rgba(56,189,248,.12)}
.step-label{display:flex;align-items:center;gap:8px;margin:13px 0 8px!important;color:#dbeafe!important}
.step-num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#2563eb;color:#fff;font-size:12px;font-weight:900;box-shadow:0 0 0 3px rgba(37,99,235,.18)}
.step-help{font-size:10px;color:#7dd3fc;font-weight:600;margin-left:auto}
.selection-status{margin:-2px 0 10px;padding:8px 11px;border:1px solid rgba(56,189,248,.24);border-radius:10px;background:rgba(8,47,73,.42);color:#bae6fd;font-size:11px;text-align:center}
.qtab-btn.on:after{content:attr(data-selected-label);position:absolute;right:7px;top:7px;padding:2px 6px;border-radius:99px;background:#22c55e;color:#052e16;font-size:9px;font-weight:900}
.flag-img{display:block;width:100%;height:100%;object-fit:contain;background:#f8fafc;border-radius:12px;border:1px solid rgba(71,85,105,.75)}
.flag-code-fallback{display:flex;width:100%;aspect-ratio:3/2;align-items:center;justify-content:center;background:#f8fafc;color:#0f172a;font-size:38px;font-weight:900;letter-spacing:5px;text-transform:uppercase;border-radius:12px}
.flag-shot img{object-fit:contain!important;background:#f8fafc}
.land-shot img{object-fit:cover!important}
/* Capital quiz card — C style (photo + overlay) */
.cap-card-c{position:relative;width:100%;border-radius:16px;overflow:hidden;min-height:160px;background:#0c1a2e;border:1px solid #1e3a5f;margin-bottom:4px}
.cap-img{display:none;width:100%;height:160px;object-fit:cover;opacity:.72}
.cap-no-photo{display:none;width:100%;height:160px;background:linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#1e293b 100%)}
.cap-img-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,.9) 0%,rgba(0,0,0,.45) 55%,transparent 100%);padding:14px 16px}
.cap-city{font-size:36px;font-weight:900;color:#f1f5f9;letter-spacing:-1px;line-height:1.1;text-shadow:0 2px 16px rgba(0,0,0,.7)}
.cap-hint{font-size:12px;color:#94a3b8;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-top:4px}
/* 3-col qtab */
.qtab-3{grid-template-columns:1fr 1fr 1fr!important}
.qtab-3 .qtab-btn{min-height:80px!important}
.cap-shot{position:relative;display:flex;width:100%;height:76px;overflow:hidden;border-radius:10px;background:#0f172a}
.cap-flag-half{width:58%;height:100%;overflow:hidden;position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#0c1a2e}
.cap-flag-img{width:88%;height:auto;max-height:82%;object-fit:contain;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.4);flex-shrink:0}
.cap-ask-half{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(135deg,#1e1b4b,#1d4ed8);position:relative}
.cap-ask-half::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,transparent,rgba(99,102,241,.6),transparent)}
.cap-ask-q{font-size:30px;font-weight:900;color:#e0e7ff;line-height:1;text-shadow:0 2px 12px rgba(99,102,241,.8)}
.cap-ask-label{font-size:8px;color:#a5b4fc;font-weight:800;letter-spacing:1.2px}

/* V4 polish: classroom-friendly world adventure UI */
body{background:radial-gradient(circle at 20% 0%,#1d4ed8 0,#0f172a 38%,#020617 100%);}
#app{position:relative;overflow:hidden;box-shadow:0 22px 60px rgba(2,6,23,.55);background:linear-gradient(180deg,#10203f 0%,#0f172a 36%,#111827 100%)}
#app:before{content:"";position:absolute;inset:-80px -40px auto auto;width:180px;height:180px;background:radial-gradient(circle,#38bdf855,transparent 62%);filter:blur(4px);pointer-events:none}
.hero{position:relative;border:1px solid #334155;background:linear-gradient(135deg,#1e3a8a55,#7c3aed33 55%,#14b8a633);border-radius:18px;padding:18px 14px 16px;margin-bottom:12px;overflow:hidden}
.hero:after{content:"✦ ✧ ✦";position:absolute;right:16px;top:12px;color:#fbbf2488;font-size:16px;letter-spacing:6px}
.hero-planet{font-size:52px;margin-bottom:6px;animation:shk 3.8s ease-in-out infinite}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.pill{font-size:10px;color:#cbd5e1;border:1px solid #475569;background:#02061755;padding:4px 8px;border-radius:99px}
.setup-label{font-size:12px;color:var(--mut);margin:10px 0 7px;font-weight:700}
.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.mc{background:linear-gradient(180deg,#1e293b,#111827);min-height:150px;position:relative;overflow:hidden}
.mc:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.08),transparent 42%);pointer-events:none}
.mc.daily{grid-column:1/3;border-color:#f59e0b;background:linear-gradient(135deg,#451a03,#1e293b 55%,#0f172a)}
.mc.daily .daily-tag{display:inline-block;font-size:10px;color:#fde68a;background:#f59e0b22;border:1px solid #f59e0b55;padding:2px 8px;border-radius:99px;margin-top:8px}
.flag-frame{position:relative;width:220px;margin:0 auto;padding:10px;border-radius:16px;background:linear-gradient(145deg,#e2e8f0,#94a3b8);box-shadow:0 16px 30px rgba(0,0,0,.25)}
.flag-frame:after{content:"";position:absolute;inset:10px;border-radius:8px;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 38%);pointer-events:none}
#qtitle{background:linear-gradient(90deg,#fff,#c7d2fe);-webkit-background-clip:text;background-clip:text;color:transparent}
.lm-wrap:after{content:"REAL PHOTO";position:absolute;top:8px;right:8px;font-size:9px;letter-spacing:.5px;color:#fff;background:rgba(15,23,42,.72);border:1px solid rgba(255,255,255,.18);padding:3px 7px;border-radius:99px;backdrop-filter:blur(6px)}
.ob{min-height:54px;border-radius:13px;background:linear-gradient(180deg,#1e293b,#111827)}
.ob:hover:not([disabled]){transform:translateY(-1px);box-shadow:0 8px 20px rgba(2,6,23,.35)}
.result-title{display:inline-block;margin:3px 0 8px;padding:5px 12px;border-radius:99px;background:#f59e0b1d;border:1px solid #f59e0b55;color:#fde68a;font-size:13px;font-weight:800}
.review-card{padding:10px 0;border-top:1px solid var(--brd);display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}
.review-q{font-size:11px;color:#cbd5e1;margin-bottom:4px;font-weight:700}
.review-note{font-size:11px;color:#94a3b8;margin-top:3px;line-height:1.35}
.voicebtn{position:fixed;bottom:64px;right:16px;width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--brd);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:200;transition:background .2s}
.voicebtn.on{background:#f59e0b;color:#111827;border-color:#f59e0b}
.voicebtn:hover{background:#f59e0b;color:#111827}
@media(max-width:420px){#app{border-radius:0}.hero{padding-top:16px}.flag-frame{width:205px}.lm-img,.lm-fb{height:175px}.ob{font-size:12px}}
@media(max-width:480px){
  body{margin:0!important;overflow-x:hidden}
  #app{width:100%!important;max-width:none!important;min-height:100svh;padding:10px!important;border-radius:0!important}
  .hero{min-height:auto!important;padding:10px!important}
  .hero-planet{height:auto!important;margin-bottom:4px!important}
  .css-globe,#globe3d{max-width:min(68vw,250px)!important;max-height:min(68vw,250px)!important}
  .qtab{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .qtab-btn{min-width:0!important;overflow:hidden}
  .quiz-shot{width:100%!important;max-width:132px!important;height:78px!important}
  .quiz-shot img{width:100%!important;height:100%!important;object-fit:cover!important}
  .setup-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .mc{min-width:0!important}
  .flag-frame{width:min(88vw,244px)!important}
  #gfl{width:100%!important;height:auto!important;aspect-ratio:3/2!important}
  .lm-wrap{width:100%!important}
  .lm-img,.lm-fb{width:100%!important;height:auto!important;min-height:190px!important;max-height:55svh!important;object-fit:contain!important}
  .audio-panel{right:10px!important;bottom:64px!important;width:calc(100vw - 20px)!important}
}
/* World Quest polish */
.version-badge{position:absolute;left:12px;top:12px;font-size:10px;color:#cbd5e1;background:rgba(15,23,42,.58);border:1px solid rgba(255,255,255,.16);padding:3px 8px;border-radius:999px;backdrop-filter:blur(6px)}
.daily-done{color:#86efac!important;background:#22c55e22!important;border-color:#22c55e66!important}
#gnx{opacity:.72;pointer-events:auto}
.review-card:first-child{border-top:none}


/* Landmark photo fixes: full image, no answer-hint city, stronger loading state */
.lm-wrap{background:#08111f;border-radius:14px;border:1px solid #334155;overflow:hidden}
.lm-img{height:230px!important;object-fit:contain!important;background:#08111f;border:none!important;border-radius:13px!important;padding:0;filter:saturate(1.08) contrast(1.04);}
.lm-fb{height:230px!important;background:linear-gradient(135deg,#111827,#0f172a)!important;border:none!important;border-radius:13px!important}
.lm-badge{bottom:10px;left:10px;max-width:72%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(2,6,23,.78);border:1px solid rgba(255,255,255,.14);font-weight:800}
.photo-fb:before{content:"";width:44px;height:44px;border-radius:50%;border:3px solid rgba(148,163,184,.25);border-top-color:#60a5fa;animation:spin 1s linear infinite;margin-bottom:8px}
#glm-loader{display:none!important}

/* V4.8 development baseline: V4.7 premium world quest UI */
body{
  min-height:100svh;
  background:
    linear-gradient(180deg,rgba(7,89,133,.32),transparent 32%),
    linear-gradient(145deg,rgba(20,184,166,.2),transparent 38%),
    linear-gradient(225deg,rgba(37,99,235,.2),transparent 42%),
    linear-gradient(180deg,#061829 0%,#07111f 48%,#020617 100%)!important;
}
#app{
  max-width:430px;
  padding:13px;
  background:
    linear-gradient(180deg,rgba(15,23,42,.86),rgba(2,6,23,.94)),
    radial-gradient(circle at 50% 0%,rgba(14,165,233,.22),transparent 34%)!important;
  border:1px solid rgba(148,163,184,.14);
  border-radius:24px;
}
.hero{
  border:1px solid rgba(125,211,252,.22)!important;
  background:
    linear-gradient(180deg,rgba(12,74,110,.48),transparent 32%),
    linear-gradient(135deg,rgba(20,184,166,.18),transparent 36%),
    linear-gradient(225deg,rgba(99,102,241,.2),transparent 42%),
    linear-gradient(180deg,rgba(7,33,58,.98),rgba(8,20,38,.95) 58%,rgba(3,10,23,.98))!important;
  border-radius:24px!important;
  padding:12px 13px 13px!important;
  box-shadow:0 22px 60px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.08);
}
.hero:before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.45) 0 1px,transparent 1.5px),
    radial-gradient(circle,rgba(125,211,252,.38) 0 1px,transparent 1.5px);
  background-size:56px 56px,88px 88px;
  background-position:8px 12px,34px 18px;
  opacity:.28;
  pointer-events:none;
}
.hero:after{

function wikiSummaryUrl(title){return 'https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title||'');}
function wikiPageUrl(title){return 'https://en.wikipedia.org/wiki/'+encodeURIComponent(title||'').replace(/%20/g,'_');}
function commonsFileUrl(file,width=960){return 'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(file)+'?width='+width;}
function commonsRedirectUrl(file,width=960){return 'https://commons.wikimedia.org/wiki/Special:Redirect/file/'+encodeURIComponent(file)+'?width='+width;}
function commonsFilePage(file){return 'https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(file).replace(/%20/g,'_');}
function getOriginalCommonsFile(url){
  try{
    const clean=url.split('?')[0];
    const parts=clean.split('/').filter(Boolean);
    const idx=parts.findIndex(x=>x==='thumb');
    if(idx>=0 && parts.length>=idx+4) return decodeURIComponent(parts[parts.length-2]);
    return decodeURIComponent(parts[parts.length-1]||'');
  }catch(e){return '';}
}

const LANDMARK_TARGET_COUNT=120;
function buildFamousLandmarkPool(){
  const byKey=new Map();
  LM.forEach(l=>{
    [l.en,l.ko,l.zh,l.wiki].filter(Boolean).forEach(k=>{
      if(!byKey.has(k))byKey.set(k,l);
    });
  });
  const picked=[];
  const seen=new Set();
  FAMOUS_LANDMARK_ORDER.forEach(k=>{
    const item=byKey.get(k);
    if(item&&!seen.has(item.en)){
      picked.push(item);
      seen.add(item.en);
    }
  });
  if(picked.length<100){
    LM.forEach(l=>{
      if(picked.length>=LANDMARK_TARGET_COUNT)return;
      if(!seen.has(l.en)){
        picked.push(l);
        seen.add(l.en);
      }
    });
  }
  return picked.slice(0,LANDMARK_TARGET_COUNT);
}

function prepCap(m){
  const base=activeCountries().filter(c=>CAP_FAMOUS.has(c[0])&&CAP[c[0]]&&CAP_EN[c[0]]);
  const pool=m==='challenge'?sh(base).slice(0,challengeTotal()):sh([...base]);
  return pool.map(c=>{
    const sm=base.filter(x=>x[2]===c[2]&&x[0]!==c[0]);
    const df=base.filter(x=>x[2]!==c[2]&&x[0]!==c[0]);
    let wr=sh(sm).slice(0,3);
    if(wr.length<3)wr=[...wr,...sh(df).slice(0,3-wr.length)];
    const opts=sh([c,...wr.slice(0,3)]);
    return{type:'cap',code:c[0],name:c[1],reg:c[2],cap:CAP[c[0]],opts,cor:opts.findIndex(x=>x[0]===c[0])};
  });
}
async function fetchWikiThumb(lm){
  if(!lm||!lm.wiki)return '';
  const key=lm.wiki;
  if(IMG_CACHE[key])return IMG_CACHE[key];
  try{
    const r=await fetch(wikiSummaryUrl(key),{headers:{'accept':'application/json'}});
    if(!r.ok)throw new Error('wiki '+r.status);
    const d=await r.json();
    const src=(d.thumbnail&&d.thumbnail.source)||(d.originalimage&&d.originalimage.source)||'';
    IMG_CACHE[key]=src;
    return src;
  }catch(e){return '';}
}
function landmarkImgFail(img){
  let srcs=[];
  try{srcs=JSON.parse(img.dataset.srcs||'[]');}catch(e){}
  const next=(parseInt(img.dataset.idx||'0',10)||0)+1;
  if(srcs[next]){
    img.dataset.idx=String(next);
    img.src=srcs[next];
    return;
  }
  img.style.display='none';
  const fb=document.getElementById('glm-fb');
  if(fb)fb.style.display='flex';
}
async function loadLandmarkImage(img,lm){
  if(!img||!lm)return;
  const fb=document.getElementById('glm-fb');
  const token=(lm.wiki||lm.ko||'')+'_'+Date.now();
  img.dataset.token=token;
  let srcs=lm.srcs&&lm.srcs.length?[...lm.srcs]:[];
  img.dataset.idx='0';
  img.dataset.srcs=JSON.stringify(srcs);
  img.alt=lmName(lm)+' photo';
  img.style.display='none';
  if(fb)fb.style.display='flex';
  const thumb=await fetchWikiThumb(lm);
  if(img.dataset.token!==token)return;
  if(thumb&&!srcs.includes(thumb))srcs.unshift(thumb);
  if(srcs[0]){
    img.dataset.idx='0';
    img.dataset.srcs=JSON.stringify(srcs);
    if(fb)fb.style.display='none';
    img.style.display='block';
    img.src=srcs[0];
  }
}
function preloadLandmarkImage(q){
  try{
    if(q&&q.type==='land'&&q.lm){
      if(q.lm.img){const im=new Image();im.src=q.lm.img;}
      else if(q.lm.wiki)fetchWikiThumb(q.lm);
    }
  }catch(e){}
}

  const SECS=[

      {b:[41,45,48,47], p:[41,45,48,52], m:[72,0,71,69]},  // F     F→A→C→B
      {b:[48,52,55,57], p:[48,52,55],    m:[67,69,72,0]},  // C     C→E→G→A
      {b:[43,47,50,48], p:[43,47,50],    m:[71,0,69,67]},  // G     G→B→D→C
      {b:[45,52,48,50], p:[45,48,52],    m:[72,74,76,0]},  // Am(↑) A→E→C→D
      {b:[36,40,43,45], p:[36,40,43,48], m:[64,65,67,69]}, // Dm    D→F→A→C
      {b:[41,45,48,47], p:[41,45,48,52], m:[69,71,72,0]},  // F     F→A→C→B
      {b:[40,44,47,45], p:[40,44,47,52], m:[76,74,72,71]}, // E7    E→G#→B→A

    { bpm:96, chords:[ // C — Triumph, most energetic
      {b:[41,45,48,50], p:[41,45,48,52], m:[72,74,76,0]},  // F     F→A→C→D
      {b:[43,47,50,52], p:[43,47,50,55], m:[0,74,72,71]},  // G     G→B→D→E

      {b:[40,44,47,48], p:[40,44,47,52], m:[0,67,69,71]},  // E     E→G#→B→C
      {b:[41,48,45,43], p:[41,45,48],    m:[72,76,79,0]},  // F(↑)  F→C→A→G
      {b:[43,50,47,45], p:[43,47,50],    m:[0,76,74,72]},  // G     G→D→B→A

  function initCtx(){
    if(!ctx){
      ctx=new(window.AudioContext||window.webkitAudioContext)();
      mGain=ctx.createGain();
      mGain.gain.value=bgmEnabled?bgmVolume:0;
      mGain.connect(ctx.destination);
      sfxGain=ctx.createGain();
      sfxGain.connect(ctx.destination);
    }
    if(ctx.state==='suspended')ctx.resume();
    return ctx;
  }

  function playBass(midi,t,dur,vScale){
    // Walking bass guitar: sawtooth body + sub sine depth
    try{
      const c=initCtx(),freq=hz(midi-12);
      // Sawtooth body (bass guitar tone)
      const oS=c.createOscillator(),shp=c.createWaveShaper(),flt=c.createBiquadFilter(),gS=c.createGain();
      oS.type='sawtooth';oS.frequency.value=freq;
      shp.curve=BDIST;
      flt.type='lowpass';flt.frequency.value=490;flt.Q.value=2.2;
      gS.gain.setValueAtTime(.001,t);
      gS.gain.linearRampToValueAtTime(.3*vScale,t+.016);   // Fast pluck attack
      gS.gain.exponentialRampToValueAtTime(.13*vScale,t+dur*.5);
      gS.gain.exponentialRampToValueAtTime(.001,t+dur);
      oS.connect(shp);shp.connect(flt);flt.connect(gS);gS.connect(mGain);
      oS.start(t);oS.stop(t+dur+.05);
      // Sub sine (depth)
      const oB=c.createOscillator(),gB=c.createGain();
      oB.type='sine';oB.frequency.value=freq*.5;
      gB.gain.setValueAtTime(.001,t);
      gB.gain.linearRampToValueAtTime(.22*vScale,t+.025);
      gB.gain.exponentialRampToValueAtTime(.001,t+dur*.82);
      oB.connect(gB);gB.connect(mGain);
      oB.start(t);oB.stop(t+dur+.05);
    }catch(e){}
  }

  function playKick(t){
    // Pitched sine thump on strong beats — rhythmic foundation
    try{
      const c=initCtx(),o=c.createOscillator(),g=c.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(85,t);
      o.frequency.exponentialRampToValueAtTime(33,t+.14);
      g.gain.setValueAtTime(.001,t);
      g.gain.linearRampToValueAtTime(.38,t+.007);
      g.gain.exponentialRampToValueAtTime(.001,t+.24);
      o.connect(g);g.connect(mGain);
      o.start(t);o.stop(t+.3);
    }catch(e){}
  }

  function playPad(midi,t,dur){
    // Soft strings pad (3-voice chorus, very low volume)
    try{
      const c=initCtx();
      [-5,0,5].forEach(det=>{
        const o=c.createOscillator(),flt=c.createBiquadFilter(),g=c.createGain();
        o.type='sawtooth';o.frequency.value=hz(midi);o.detune.value=det;
        flt.type='lowpass';flt.frequency.value=1400;
        g.gain.setValueAtTime(.001,t);
        g.gain.linearRampToValueAtTime(.026,t+.42);
        g.gain.setValueAtTime(.026,Math.max(t+.42,t+dur-.55));
        g.gain.linearRampToValueAtTime(.001,t+dur);
        o.connect(flt);flt.connect(g);g.connect(mGain);
        o.start(t);o.stop(t+dur+.1);
      });
    }catch(e){}
  }

  function playMel(midi,t,dur){
    if(!midi)return;
    try{
      const c=initCtx(),freq=hz(midi);
      const o=c.createOscillator(),lfo=c.createOscillator(),lfog=c.createGain(),g=c.createGain();
      o.type='triangle';o.frequency.value=freq;
      lfo.type='sine';lfo.frequency.value=5.1;
      lfog.gain.value=freq*.011; // vibrato
      lfo.connect(lfog);lfog.connect(o.frequency);
      const tv=t+(Math.random()-.5)*.022; // timing humanize
      const vol=.052*(0.85+Math.random()*.3);
      g.gain.setValueAtTime(.001,tv);
      g.gain.linearRampToValueAtTime(vol,tv+.07);
      g.gain.setValueAtTime(vol,Math.max(tv+.07,tv+dur-.2));
      g.gain.linearRampToValueAtTime(.001,tv+dur);
      o.connect(g);g.connect(mGain);
      lfo.start(tv);lfo.stop(tv+dur+.1);
      o.start(tv);o.stop(tv+dur+.1);
    }catch(e){}
  }

  function duckMaster(){
    if(!mGain||!bgmEnabled)return;
    try{
      const base=bgmVolume;
      mGain.gain.cancelScheduledValues(ctx.currentTime);
      mGain.gain.setValueAtTime(base*.18,ctx.currentTime);
      mGain.gain.linearRampToValueAtTime(base,ctx.currentTime+.72);
    }catch(e){}
  }

  function tick(){
    if(!active)return;
    const c=initCtx();
    while(nextTime<c.currentTime+.45){
      const sec=SECS[secI];
      const bpm=sceneId==='game'?Math.min(Math.round(sec.bpm*1.13),106):sec.bpm;
      const bd=60/bpm;
      const bib=beat%4;                                 // beat-in-bar 0-3
      const chord=sec.chords[Math.floor(beat/4)%sec.chords.length];
      const t=nextTime;

      // === BASS: walking line (main driver, loudest) ===
      const vScale=bib===0?1.0:bib===2?.86:.72;        // accent beat 1, mild 3, soft 2&4
      playBass(chord.b[bib],t,bd*(bib%2===0?.87:.7),vScale);

      // === KICK: rhythmic pulse on 1 and 3 ===
      if(bib===0||bib===2)playKick(t);

      // === PAD: chord swell on beat 1 only ===
      if(bib===0){
        chord.p.forEach((n,i)=>playPad(n,t+i*.04,bd*3.8));
      }

      // === MELODY: sparse triangle+vibrato, ~78% chance ===
      const mNote=chord.m[bib];
      if(mNote&&Math.random()>.22){
        playMel(mNote,t,bd*(bib===3?1.3:.65+Math.random()*.4));
      }

      nextTime+=bd;
      beat++;
      // Switch section after 2 full chord-progression cycles
      if(beat%(sec.chords.length*4*2)===0){
        beat=0;
        secI=(secI+1)%SECS.length;
      }
    }
    schedRef=setTimeout(tick,55);
  }

  function mkSfxNote(f,dur,vol,type='sine'){
    if(!sfxEnabled||sfxVolume<=0)return;
    try{
      const c=initCtx();
      if(c.state==='suspended')c.resume();
      const now=c.currentTime,o=c.createOscillator(),g=c.createGain();
      o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(Math.max(.001,vol*sfxVolume),now);
      g.gain.exponentialRampToValueAtTime(.001,now+dur);
      o.connect(g);g.connect(sfxGain);o.start(now);o.stop(now+dur);
    }catch(e){}
  }

  return{
    start(){
      if(active)return;
      active=true;
      const c=initCtx();
      nextTime=c.currentTime+.25;
      beat=0;secI=0;
      tick();
      setAudioStatus('재생 중');
    },
    stop(){
      active=false;
      if(schedRef){clearTimeout(schedRef);schedRef=null;}
    },
    setScene(s){
      sceneId=s==='home'?'home':'game';
      if(!active&&bgmEnabled)this.start();
    },
    setVolume(){if(mGain)mGain.gain.value=bgmEnabled?bgmVolume:0;},
    isPlaying(){return active;},
    sfx(t){
      duckMaster();
      if(t==='ok'){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>mkSfxNote(f,.28,.28,'triangle'),i*85));setTimeout(()=>mkSfxNote(1568,.36,.18,'sine'),240);}
      else if(t==='no'){[220,165,110].forEach((f,i)=>setTimeout(()=>mkSfxNote(f,.35,.34,'sawtooth'),i*120));setTimeout(()=>mkSfxNote(70,.5,.26,'square'),260);}
      else if(t==='tick')mkSfxNote(1200,.06,.08,'square');
    }
  };
})();

function seeded(seed){let h=2166136261>>>0;for(let i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619);}return()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function shSeed(a,seed){let b=[...a],rnd=seeded(seed);for(let i=b.length-1;i>0;i--){let j=Math.floor(rnd()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function updT(){

  const col=tl<=3?'#ef4444':tl<=6?'#f59e0b':'#22c55e';

  if(sp)sp.style.display=(tl>Math.ceil(maxTime()*0.7)&&ch===null)?'':'none';
}

// ============================================================
// PREP QUESTIONS
// ============================================================
function prep(m){
  // Flag quiz uses the full country pool.
  const base=activeCountries();
  const pool=m==='challenge'?sh(base).slice(0,challengeTotal()):sh([...base]);
  return pool.map(c=>{
    const sm=base.filter(x=>x[2]===c[2]&&x[0]!==c[0]);
    const df=base.filter(x=>x[2]!==c[2]&&x[0]!==c[0]);
    let wr=sh(sm).slice(0,3);
    if(wr.length<3)wr=[...wr,...sh(df).slice(0,3-wr.length)];
    const opts=sh([c,...wr.slice(0,3)]);
    return{type:'flag',code:c[0],name:c[1],reg:c[2],opts,cor:opts.findIndex(x=>x[0]===c[0])};
  });
}

function prepLand(m){
  // Landmark quiz uses famous real-photo targets.
  const ac=new Set(activeCodes());
  let base=LANDMARK_POOL.filter(l=>ac.has(l.c));
  if(base.length<4)base=[...LANDMARK_POOL];
  const pool=m==='challenge'?sh([...base]).slice(0,challengeTotal()):sh([...base]);
  return pool.map(lm=>{
    const country=C.find(c=>c[0]===lm.c);
    const region=country?country[2]:'Asia';
    let wrongLM=base.filter(l=>l.c!==lm.c&&C.find(c=>c[0]===l.c&&c[2]===region));
    if(wrongLM.length<3)wrongLM=[...wrongLM,...base.filter(l=>l.c!==lm.c&&!wrongLM.includes(l))];
    if(wrongLM.length<3)wrongLM=[...wrongLM,...LANDMARK_POOL.filter(l=>l.c!==lm.c&&!wrongLM.includes(l))];
    const seen=new Set([lm.c]);
    const wrongs=sh(wrongLM).filter(l=>{if(seen.has(l.c))return false;seen.add(l.c);return true;}).slice(0,3).map(l=>l.c);
    const opts=sh([lm.c,...wrongs]);
    return{type:'land',lm,code:lm.c,name:country?country[1]:'',reg:region,opts,cor:opts.indexOf(lm.c)};
  });
}


function prepDaily(){
  const seed=todayKey()+'_'+difficulty;
  const flags=shSeed(prep('challenge'),seed+'_flags').slice(0,6);
  const lands=shSeed(prepLand('challenge'),seed+'_lands').slice(0,4);
  return shSeed([...flags,...lands],seed+'_mix');
}

function grd(pct){
  if(mode==='challenge'||mode==='daily'||mode==='review'){if(pct>=90)return'S';if(pct>=75)return'A';if(pct>=60)return'B';if(pct>=45)return'C';return'D';}
  if(sc>=200)return'S';if(sc>=150)return'A';if(sc>=100)return'B';if(sc>=50)return'C';return'D';
}

function showOpts(q,correctIdx,chosenIdx,revealed){
  const w=document.getElementById('gopts');

    const code=q.type==='land'?c:c[0];
    const name=q.type==='cap'?(lang==='en'?CAP_EN[c[0]]:CAP[c[0]]):(q.type==='land'?cname(c):cname(c[0]));
    const btn=document.createElement('button');
    btn.className='ob';
    if(revealed&&correctIdx>=0){
      if(i===correctIdx)btn.classList.add('ok');
      else if(i===chosenIdx)btn.classList.add('no');
      else btn.classList.add('dm');
      btn.setAttribute('disabled','true');
    }
    // Label badge
    const lb=document.createElement('span');
    lb.className='ol'; lb.textContent=LS[i];
    // Name only: no mini flags in choices, otherwise flag quiz becomes too easy.
    const ns=document.createElement('span');

    const kb=document.createElement('span');
    kb.style.cssText='font-size:10px;color:#475569'; kb.textContent=i+1;

    btn.append(lb,ns,kb);
    if(!revealed||correctIdx<0)btn.onclick=()=>pick(i);
    w.appendChild(btn);
  });

function pick(i){
  if(ch!==null)return;
  stpT(); ch=i;
  const q=qs[qi];
  const ok=i===q.cor;
  if(ok) comboCount++; else comboCount=0;
  const bonus=ok&&mode!=='challenge'&&tl>Math.ceil(maxTime()*0.7);
  const comboBonus=ok&&comboCount>=3?Math.min((comboCount-2)*2,10):0;
  const gained=ok?10+(bonus?5:0)+comboBonus:0;
  answerEffect(ok);
  if(ok){sc+=gained;shFl(gained);BGM.sfx('ok');if(comboCount>=3)showCombo(comboCount);}
  else{if(mode==='challenge')sc=Math.max(0,sc-2);BGM.sfx('no');}
  as.push({q,ch:i,ok,score:gained});
  showOpts(q,q.cor,i,true);
  if(!ok&&mode==='survival'){lv--;updL();if(lv<=0){shFB(false,false,q);setTimeout(()=>endG(),1600);return;}}
  shFB(ok,false,q,bonus);
}

function answerEffect(ok){

function onTO(){
  if(!gameActive)return;
  if(ch!==null)return;ch=-1;
  const q=qs[qi];
  as.push({q,ch:-1,ok:false,score:0});
  answerEffect(false);
  BGM.sfx('no');
  if(mode==='survival'){lv--;updL();}
  document.getElementById('gto').textContent=t('timeout');
  document.getElementById('gto').style.display='block';
  showOpts(q,q.cor,-1,true);
  if(mode==='survival'&&lv<=0){setTimeout(()=>endG(),1400);return;}
  shFB(false,true,q,false);

function nxt(){
  stpAuto();
  const total=gameTotal();
  if(mode==='survival'&&lv<=0){endG();return;}
  if(mode==='challenge'&&tl<=0){endG();return;}
  if((mode==='challenge'||mode==='daily'||mode==='review')&&qi+1>=total){endG();return;}
  qi++;
  if(mode==='survival'&&qi>=qs.length)qs=[...qs,...(qtype==='flag'?prep('survival'):qtype==='cap'?prepCap('survival'):prepLand('survival'))];
  rnQ();
}

let quizPreviewTimer=null;
function initQuizPreview(){
  const landImg=document.getElementById('qt-land-img');
  const fgImgs=document.querySelectorAll('.flag-grid .fg-img');
  if(!landImg||quizPreviewTimer)return;
  const flagSets=[
    ['br','jp','de','us'],['fr','kr','au','gb'],
    ['cn','in','mx','za'],['eg','tr','it','ar']
  ];
  const lands=[
    'https://commons.wikimedia.org/wiki/Special:Redirect/file/Eiffel_Tower_from_the_Tour_Montparnasse_3%2C_Paris_May_2014.jpg?width=320',
    'https://commons.wikimedia.org/wiki/Special:Redirect/file/Sydney_Opera_House_Sails.jpg?width=320',
    'https://commons.wikimedia.org/wiki/Special:Redirect/file/Colosseum_in_Rome%2C_Italy_-_April_2007.jpg?width=320',
    'https://commons.wikimedia.org/wiki/Special:Redirect/file/Taj_Mahal_in_March_2004.jpg?width=320',
    'https://commons.wikimedia.org/wiki/Special:Redirect/file/Christ_the_Redeemer_-_Cristo_Redentor.jpg?width=320'
  ];
  const capFlags=['fr','jp','de','br','kr','au','it','eg'];
  const base='https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/flags/4x3/';
  const capFlagEl=document.getElementById('qt-cap-flag');
  let idx=0;
  function paint(){
    idx=(idx+1)%Math.max(flagSets.length,lands.length,capFlags.length);
    landImg.style.opacity='0';
    fgImgs.forEach(im=>im.style.opacity='0');
    if(capFlagEl)capFlagEl.style.opacity='0';
    setTimeout(()=>{
      const fs=flagSets[idx%flagSets.length];
      fgImgs.forEach((im,i)=>{im.src=base+fs[i]+'.svg';im.style.opacity='1';});
      landImg.src=lands[idx%lands.length];
      landImg.style.opacity='1';
      if(capFlagEl){capFlagEl.src=base+capFlags[idx%capFlags.length]+'.svg';capFlagEl.style.opacity='1';}
    },180);
  }
  quizPreviewTimer=setInterval(paint,3500);
  setTimeout(paint,800);
}

function initGlobe3D(){
  const cv=document.getElementById('globe3d');
  if(!cv||cv.dataset.ready)return;
  cv.dataset.ready='1';
  const ctx=cv.getContext('2d');
  const continents=[
    [[-125,48],[-104,58],[-78,45],[-83,25],[-102,18],[-118,30]],
    [[-80,10],[-54,6],[-45,-18],[-63,-55],[-78,-28]],
    [[-10,55],[20,60],[42,45],[30,28],[4,34],[-12,44]],
    [[5,31],[30,28],[45,8],[34,-31],[16,-35],[-5,5]],
    [[42,52],[90,58],[130,42],[118,10],[78,5],[54,24]],
    [[110,-10],[154,-18],[145,-42],[115,-38]],
    [[-42,72],[-20,76],[-18,62],[-40,60]]
  ];
  const cities=[[-74,40],[2,49],[127,37],[139,35],[151,-34],[-43,-23],[31,30],[77,28]];
  let rot=0,last=0;
  function project(lon,lat,r,cx,cy){
    const lam=(lon+rot)*Math.PI/180,phi=lat*Math.PI/180;
    const x=Math.cos(phi)*Math.sin(lam),y=Math.sin(phi),z=Math.cos(phi)*Math.cos(lam);
    return {x:cx+r*x,y:cy-r*y,z};
  }
  function draw(tick){
    if(tick&&tick-last<33){requestAnimationFrame(draw);return}
    last=tick;rot+=0.45;
    const W=cv.width,H=cv.height,cx=W/2,cy=H/2,r=W*0.38;
    ctx.clearRect(0,0,W,H);
    const glow=ctx.createRadialGradient(cx,cy,10,cx,cy,r*1.42);
    glow.addColorStop(0,'rgba(125,211,252,.36)');
    glow.addColorStop(0.55,'rgba(37,99,235,.12)');
    glow.addColorStop(1,'rgba(14,165,233,0)');
    ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,r*1.42,0,Math.PI*2);ctx.fill();
    const ocean=ctx.createRadialGradient(cx-r*.35,cy-r*.45,r*.08,cx,cy,r);
    ocean.addColorStop(0,'#7dd3fc');ocean.addColorStop(.22,'#0ea5e9');ocean.addColorStop(.72,'#1d4ed8');ocean.addColorStop(1,'#082f49');
    ctx.fillStyle=ocean;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
    ctx.strokeStyle='rgba(191,219,254,.22)';ctx.lineWidth=1.3;
    for(let lat=-60;lat<=60;lat+=30){
      ctx.beginPath();
      for(let lon=-180;lon<=180;lon+=5){
        const p=project(lon,lat,r,cx,cy);
        if(p.z>-.08){if(lon===-180)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}
      }
      ctx.stroke();
    }
    for(let lon=-150;lon<=180;lon+=30){
      ctx.beginPath();let started=false;
      for(let lat=-80;lat<=80;lat+=4){
        const p=project(lon,lat,r,cx,cy);
        if(p.z>-.08){if(!started){ctx.moveTo(p.x,p.y);started=true}else ctx.lineTo(p.x,p.y)}
      }
      ctx.stroke();
    }
    continents.forEach(poly=>{
      ctx.beginPath();let any=false;
      poly.forEach(pt=>{
        const p=project(pt[0],pt[1],r,cx,cy);
        if(p.z>-.25){if(!any){ctx.moveTo(p.x,p.y);any=true}else ctx.lineTo(p.x,p.y)}
      });
      if(any){ctx.closePath();ctx.fillStyle='rgba(34,197,94,.78)';ctx.fill();ctx.strokeStyle='rgba(187,247,208,.42)';ctx.lineWidth=1.2;ctx.stroke()}
    });
    cities.forEach(c=>{
      const p=project(c[0],c[1],r,cx,cy);
      if(p.z>0){ctx.fillStyle='rgba(253,224,71,'+(0.45+p.z*.55)+')';ctx.beginPath();ctx.arc(p.x,p.y,2.1+p.z*1.9,0,Math.PI*2);ctx.fill()}
    });
    const shade=ctx.createLinearGradient(cx-r,cy,cx+r,cy);
    shade.addColorStop(0,'rgba(2,6,23,.42)');shade.addColorStop(.44,'rgba(2,6,23,0)');shade.addColorStop(1,'rgba(2,6,23,.32)');
    ctx.fillStyle=shade;ctx.fillRect(cx-r,cy-r,r*2,r*2);
    ctx.restore();
    ctx.strokeStyle='rgba(219,234,254,.58)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='rgba(250,204,21,.45)';ctx.lineWidth=1.4;ctx.beginPath();ctx.ellipse(cx,cy,r*1.13,r*.28,-0.38,0,Math.PI*2);ctx.stroke();
    requestAnimationFrame(draw);
  }
  draw(0);
  requestAnimationFrame(draw);
}

function sGet(key,shared=false){
  try{if(window.storage&&window.storage.get)return window.storage.get(key,shared).then(r=>r?r.value:null).catch(()=>localStorage.getItem(key));}
  catch(e){}
  return Promise.resolve(localStorage.getItem(key));
}
function sSet(key,val,shared=false){
  try{localStorage.setItem(key,val);}catch(e){}
  try{if(window.storage&&window.storage.set)return window.storage.set(key,val,shared).catch(()=>{});}
  catch(e){}
  return Promise.resolve();
}
async function svLB(cor,tot,el,g){
  const key='wq_'+mode+'_'+qtype+'_'+difficulty;
  const now=new Date();
  const ts=(now.getMonth()+1)+'/'+now.getDate()+' '+now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
  const entry={nickname:nick,score:sc,correct:cor,total:tot,time:el,grade:g,date:ts,lang,difficulty};
  let list=[];
  try{list=JSON.parse(await sGet(key,true)||'[]');}catch(e){list=[];}
  list.push(entry);list.sort((a,b)=>b.score-a.score);list=list.slice(0,20);
  await sSet(key,JSON.stringify(list),true);
}
async function ldLB(m,qt){try{return JSON.parse(await sGet('wq_'+m+'_'+qt+'_'+difficulty,true)||'[]');}catch(e){return[];}}
async function svBest(){await sSet('wq_bs_'+difficulty,String(bS),false);await sSet('wq_bc_'+difficulty,String(bC),false);await sSet('wq_bd_'+difficulty,String(bD),false);}

async function updStreak(){
  const today=todayKey();
  const last=localStorage.getItem('wq_streak_date')||'';
  const count=parseInt(localStorage.getItem('wq_streak_count')||'0');
  const yesterday=(()=>{const d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');})();
  let next=1;
  if(last===today)next=count;
  else if(last===yesterday)next=count+1;
  localStorage.setItem('wq_streak_date',today);
  localStorage.setItem('wq_streak_count',String(next));
  renderStreak(next);
}

function renderStreak(n){
  const el=document.getElementById('home-streak');
  if(!el)return;
  if(!n||n<2){el.style.display='none';return;}
  el.style.display='flex';
  el.innerHTML='🔥 <strong>'+n+'</strong>&nbsp;'+(lang==='en'?'day streak!':lang==='zh'?'连续天数！':'일 연속 플레이!');
}

async function ldStreak(){
  const today=todayKey();
  const last=localStorage.getItem('wq_streak_date')||'';
  const count=parseInt(localStorage.getItem('wq_streak_count')||'0');
  const yesterday=(()=>{const d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');})();
  const alive=last===today||last===yesterday;
  renderStreak(alive?count:0);
}

  try{
    const unit=scoreWord();
    const sr=document.getElementById('ms-r'),cr=document.getElementById('mc-r'),dr=document.getElementById('md-r');
    if(sr)sr.textContent=t('best_surv')+': '+(bS||0)+unit;

    if(dr)dr.textContent=t('best_daily')+': '+(bD||0)+unit;

  try{
    const panel=document.getElementById('hpv'),list=document.getElementById('hpl');

  }catch(e){}
}
